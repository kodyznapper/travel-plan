<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<meta name="robots" content="noindex, nofollow">
<title>Trip Plans - วางแผนเที่ยว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root,:root[data-theme="dark"]{
  --s1:#0E1116;--s2:#151A22;--card:#1C222B;--card2:#252C37;--line:#2E3745;
  --text:#EEF1F5;--body:#A9B1BD;--dim:#8B95A3;
  --or:#F05032;--cy:#22D3EE;--on-acc:#0E1116;
  --or-soft:rgba(240,80,50,.13);--cy-soft:rgba(34,211,238,.10);--scrim:rgba(4,6,9,.66);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --s1:#0E1116;--s2:#151A22;--card:#1C222B;--card2:#252C37;--line:#2E3745;
    --text:#EEF1F5;--body:#A9B1BD;--dim:#8B95A3;
    --or:#F05032;--cy:#22D3EE;--on-acc:#0E1116;
    --or-soft:rgba(240,80,50,.13);--cy-soft:rgba(34,211,238,.10);--scrim:rgba(4,6,9,.66);
  }
}
:root[data-theme="light"]{
  --s1:#F3F5F8;--s2:#E8ECF1;--card:#FBFCFD;--card2:#EEF1F5;--line:#D3DAE3;
  --text:#151A22;--body:#3A4351;--dim:#5B6573;
  --or:#C2410C;--cy:#0E7490;--on-acc:#FBFCFD;
  --or-soft:rgba(194,65,12,.09);--cy-soft:rgba(14,116,144,.08);--scrim:rgba(21,26,34,.42);
  color-scheme:light;
}
:root{
  --f:'IBM Plex Sans Thai',Tahoma,sans-serif;
  --zh:'IBM Plex Sans Thai','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --m:'JetBrains Mono','Courier New',monospace;
  --tb:56px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 128px);background:var(--s1)}
body{margin:0;background:var(--s1);color:var(--text);font:400 16px/1.6 var(--f);-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--s1)}
a{color:var(--cy)}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
button{font:inherit}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--dim);font-size:14px}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--s1);border-bottom:1px solid var(--line)}
.tb-in{max-width:1120px;margin:0 auto;height:var(--tb);display:flex;align-items:center;gap:8px;padding:0 16px}
.brand{font-weight:700;font-size:19px;color:var(--text);text-decoration:none;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.mark{display:flex;align-items:center;gap:3px}
.mark i{display:block;width:12px;height:12px;border-radius:50%;border:3px solid var(--or)}
.mark i+i{width:8px;height:8px;border:0;background:var(--cy)}
.tb-title{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.tb-title b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{font-size:12.5px;color:var(--dim)}
.tb-sp{flex:1}
.ibtn{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;text-decoration:none;padding:0}
.ibtn:hover{border-color:var(--dim)}
.ibtn.sm{width:34px;height:34px;border-radius:8px}
.ibtn.sm .ic{width:17px;height:17px}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn.danger{color:var(--or)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:500;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn .ic{width:18px;height:18px}
.btn.pri{background:var(--or);border-color:var(--or);color:var(--on-acc);font-weight:600}
.btn.cy{background:var(--cy);border-color:var(--cy);color:var(--on-acc);font-weight:600}
.btn.danger{color:var(--or);border-color:var(--or)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13.5px;border-radius:8px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.add{border-style:dashed;background:transparent;color:var(--body);width:100%}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 72px}
.two{display:grid;gap:14px}
@media (min-width:820px){.two{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sec-h h2{font-size:20px;font-weight:600}
.o{--dc:var(--or)}
.c{--dc:var(--cy)}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tb));z-index:20;background:var(--s1);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1120px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs-in::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;padding:3px 14px;border-radius:12px;border:1px solid var(--line);color:var(--body);text-decoration:none;font-size:14px;font-weight:500;line-height:1.2}
.tab:hover{border-color:var(--dim)}
.tab.day{min-width:62px;padding:3px 10px}
.tab.day b{font-family:var(--m);font-size:14px;font-weight:700;color:var(--dc)}
.tab.day small{font-size:12px;color:var(--dim)}
.tab[aria-current]{background:var(--text);border-color:var(--text);color:var(--s1)}
.tab.day[aria-current]{background:var(--dc);border-color:var(--dc)}
.tab.day[aria-current] b,.tab.day[aria-current] small{color:var(--on-acc)}
.tab .tdot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--or);border:2px solid var(--s1)}
.tab.plan{border-style:dashed}

/* ---------- dashboard ---------- */
.dash-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 20px}
.dash-head h1{font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-.015em}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.dash-grid{display:grid;gap:20px;align-items:start}
@media (min-width:960px){.dash-grid{grid-template-columns:1fr 372px}}
.tlist{display:grid;gap:14px}
.tcard{display:grid;grid-template-columns:1fr auto;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 18px 20px;text-decoration:none;color:inherit;position:relative;overflow:hidden}
.tcard:hover{border-color:var(--dim)}
.tcard::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--dc)}
.tcard.past{opacity:.55}
.tcard h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.tc-place{color:var(--body);font-size:15px;margin-top:2px}
.tc-state{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.tc-state b{font-family:var(--m);font-size:34px;line-height:1;color:var(--dc);font-weight:700}
.tc-state span{font-size:14px;color:var(--body)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px 18px;margin:14px 0 0}
.facts div{min-width:0}
.facts dt{font-size:12.5px;color:var(--dim)}
.facts dd{margin:0;font-size:15px;font-weight:500}
.stamp{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--zh);font-weight:700;background:var(--or);color:var(--on-acc);border-radius:12px;padding:10px 8px;line-height:1.1;font-size:26px;align-self:start}
.stamp.wide{font-size:16px;padding:8px 10px;max-width:120px;text-align:center}
.stamp.lg{font-size:clamp(36px,9vw,60px);padding:14px 12px;border-radius:16px;gap:4px}
.stamp.lg.wide{font-size:20px}
.now-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--or);color:var(--on-acc);text-decoration:none;font-weight:600;margin-bottom:18px}
.now-banner .ic{width:22px;height:22px}
.empty{text-align:left;padding:28px 22px}
.empty h2{font-size:22px;margin-bottom:8px}
.empty p{color:var(--body);margin-bottom:16px}

/* calendar */
.cal-det{background:var(--card);border:1px solid var(--line);border-radius:18px}
.cal-det>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:600}
.cal-det>summary::-webkit-details-marker{display:none}
.cal-det>summary .ic{transition:transform .2s}
.cal-det[open]>summary .ic{transform:rotate(180deg)}
.cal{padding:0 12px 14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:16px}
.flip{display:grid;transform:scaleX(-1)}
.cal-wd,.cw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-wd span{text-align:center;font-size:12.5px;color:var(--dim);padding:4px 0}
.cw{border-top:1px solid var(--line);padding:3px 0 6px;row-gap:3px;min-height:46px}
.cd{grid-row:1;text-align:center;font-family:var(--m);font-size:13px;color:var(--body);padding:3px 0}
.cd.out{opacity:.4}
.cd.today span{background:var(--text);color:var(--s1);border-radius:999px;padding:1px 6px;font-weight:700}
.cbar{display:block;height:21px;line-height:21px;margin:0 1px;border-radius:6px;font-size:12px;font-weight:600;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;background:var(--dc);color:var(--on-acc)}
.cbar.past{opacity:.4}
.cbar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.cbar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.cal-foot{display:flex;justify-content:flex-end;margin-top:8px}

/* ---------- overview ---------- */
.ov-hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;margin:6px 0 8px}
.ov-hero h1{font-size:clamp(32px,7vw,58px);font-weight:700;line-height:1.08;letter-spacing:-.02em;margin:4px 0 6px}
.ov-place{color:var(--body);font-size:16px}
.ov-state{margin-top:14px;display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--dc)}
.ov-state .ic{width:18px;height:18px}
.metro-card{padding:16px 0 6px;margin-top:22px;--mbg:var(--card)}
.metro-card h2{font-size:15px;font-weight:600;color:var(--body);padding:0 18px 4px}
.metro{width:100%;min-height:40px}
.metro svg{display:block;width:100%;height:auto;overflow:visible}
.m-seg{fill:none;stroke-width:6;stroke-linecap:round}
.m-seg.o{stroke:var(--or)}.m-seg.c{stroke:var(--cy)}
.m-node{fill:var(--mbg,var(--s2));stroke-width:3.5}
.m-node.o{stroke:var(--or)}.m-node.c{stroke:var(--cy)}
.m-node.end{stroke-width:5}
.m-label{fill:var(--body);font:500 13px var(--f)}
.m-tag{font:700 12px var(--m)}
.m-tag.o{fill:var(--or)}.m-tag.c{fill:var(--cy)}
.metro svg.anim .m-seg{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:mdraw .5s cubic-bezier(.3,.6,.3,1) forwards}
.metro svg.anim .m-node,.metro svg.anim text{opacity:0;animation:mfade .3s ease-out forwards}
@keyframes mdraw{to{stroke-dashoffset:0}}
@keyframes mfade{to{opacity:1}}
.dlist{display:grid;gap:10px}
.drow{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-decoration:none;color:inherit}
.drow:hover{border-color:var(--dc)}
.drow .dn{font-family:var(--m);font-size:30px;font-weight:700;color:var(--dc);line-height:1;text-align:center}
.drow .dd{font-size:13.5px;color:var(--dim)}
.drow h3{font-size:17px;font-weight:600}
.drow .dr{font-size:14px;color:var(--body);margin-top:2px}
.drow .dc-n{font-size:13px;color:var(--dim);text-align:right;white-space:nowrap}
.today-chip{display:inline-block;font-size:12px;font-weight:700;background:var(--or);color:var(--on-acc);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
.fl{display:grid;gap:12px}
.flt{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.flt:last-child{border-bottom:0;padding-bottom:0}
.flt .code{font-family:var(--m);font-weight:700;font-size:18px;color:var(--cy)}
.flt .route{font-weight:600}
.flt .time{grid-column:1/-1;font-size:15px;color:var(--body)}
.flt .time b{font-family:var(--m);font-weight:700;color:var(--text);margin-left:6px}
.flt .meta{grid-column:1/-1;font-size:14px;color:var(--body)}
.card h2.ch{font-size:15px;font-weight:600;color:var(--body);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.stay-name{font-weight:600;font-size:17px}
.bar{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cy);border-radius:12px;padding:16px 18px}
.bar.or{border-left-color:var(--or)}
.bar h2,.bar h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar.or h2,.bar.or h3{color:var(--or)}
.bar:not(.or) h2,.bar:not(.or) h3{color:var(--cy)}
.trip-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px;padding-top:18px;border-top:1px dashed var(--line)}
.trip-tools p{flex-basis:100%;font-size:13.5px;color:var(--dim)}

/* ---------- day ---------- */
.day-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-top:4px}
.dbadge{width:84px;height:84px;border-radius:18px;background:var(--dc);color:var(--on-acc);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dbadge span{font-size:13px;font-weight:600}
.dbadge b{font-family:var(--m);font-size:42px;font-weight:700;margin-top:4px}
.dh-date{color:var(--dc);font-weight:600;font-size:15px}
.day-head h1{font-size:clamp(24px,5vw,36px);font-weight:700;letter-spacing:-.01em;margin:2px 0 6px}
.dh-sum{color:var(--body);font-size:15px}
.stay{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.stay .ic{color:var(--dc)}
.stay small{display:block;font-size:12.5px;color:var(--dim)}
.stay b{font-weight:600}
@media (min-width:860px){.day-head{grid-template-columns:auto 1fr 280px}.stay{grid-column:auto}}
.band{position:relative;background:var(--s2);border:1px solid var(--line);border-radius:18px;padding:10px 0 2px;margin:18px 0;overflow:hidden;--mbg:var(--s2)}
.band::after{content:attr(data-n);position:absolute;right:10px;bottom:-0.32em;font:700 120px/1 var(--m);color:var(--dc);opacity:.07;pointer-events:none}
.tl-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.tl-tools .muted{font-size:13.5px}

/* timeline */
.tl{--tc:64px;--nc:22px;list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:calc(var(--tc) + 8px + var(--nc) / 2 - 1px);top:14px;bottom:14px;width:2px;background:var(--line)}
.it{display:grid;grid-template-columns:var(--tc) var(--nc) minmax(0,1fr);column-gap:8px;margin-bottom:10px}
.it-time{font-family:var(--m);font-weight:700;font-size:15px;text-align:right;padding-top:13px;line-height:1.25;color:var(--text);word-break:break-word}
.it-time small{display:block;font-weight:500;font-size:12.5px;color:var(--dim)}
.it-node{position:relative}
.it-node::after{content:"";position:absolute;left:calc(var(--nc) / 2 - 8px);top:16px;width:16px;height:16px;border-radius:50%;background:var(--s1);border:3.5px solid var(--dc);box-sizing:border-box}
.it.hl .it-node::after{background:var(--dc)}
.it-body{min-width:0}
.it-main{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 18px;gap:12px;align-items:start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:inherit;cursor:pointer}
.it-main:hover{border-color:var(--dim)}
.it-main.static{cursor:default}
.it-main.static:hover{border-color:var(--line)}
.it.hl .it-main{border-color:var(--or);background:linear-gradient(var(--or-soft),var(--or-soft)),var(--card)}
.it-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--dc)}
.it-icon .ic{width:22px;height:22px}
.it-t{display:block;font-weight:600;font-size:16px;line-height:1.4}
.zh{font-family:var(--zh);font-weight:500;color:var(--dim);font-size:14px;margin-left:6px}
.it-en{display:block;color:var(--dim);font-size:13.5px;line-height:1.4}
.it-line{display:block;color:var(--body);font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.it-tags:empty{display:none}
.chev{color:var(--dim);margin-top:10px;transition:transform .2s}
.chev .ic{width:18px;height:18px}
.it.open .chev{transform:rotate(180deg)}
.it-detail{display:none;margin:6px 0 2px 0;padding:12px 14px;border-left:3px solid var(--dc);background:var(--card);border-radius:0 12px 12px 0}
.it.open .it-detail{display:block}
.it-detail dl{margin:0;display:grid;gap:10px}
.it-detail dt{font-size:12.5px;color:var(--dim);font-weight:500}
.it-detail dd{margin:0;font-size:15px;color:var(--text);line-height:1.55}
.it-detail .maplink{margin-top:12px}
.now{display:grid;grid-template-columns:var(--tc) var(--nc) minmax(0,1fr);column-gap:8px;align-items:center;margin:-2px 0 10px}
.now-t{font:700 13px var(--m);color:var(--or);text-align:right}
.now-dot{justify-self:center;width:12px;height:12px;border-radius:50%;background:var(--or);box-shadow:0 0 0 4px var(--or-soft)}
.now-l{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--or)}
.now-l::after{content:"";flex:1;height:2px;background:var(--or)}
@media (max-width:560px){
  .tl{--tc:50px;--nc:18px}
  .it-time{font-size:13.5px}
  .it-main{grid-template-columns:34px minmax(0,1fr) 16px;gap:10px;padding:10px}
  .it-icon{width:34px;height:34px;border-radius:9px}
  .it-icon .ic{width:19px;height:19px}
  .dbadge{width:70px;height:70px;border-radius:16px}
  .dbadge b{font-size:34px}
}
.daynav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.daynav a{flex:1;max-width:48%}
.daynav .next{margin-left:auto;justify-content:flex-end}
details.more{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
details.more>summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary .ic{transform:rotate(180deg)}
details.more>.md{padding:0 16px 16px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;line-height:1.5;padding:0 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.badge.b-ok{color:var(--cy)}
.badge.b-doc{color:var(--dim)}
.badge.b-warn{color:var(--or)}
.badge.hl{background:var(--or);border-color:var(--or);color:var(--on-acc)}

/* markdown */
.md{color:var(--body);font-size:15px;line-height:1.65}
.md>*+*{margin-top:10px}
.md p,.md li{color:var(--body)}
.md strong{color:var(--text);font-weight:600}
.md ul,.md ol{padding-left:22px;margin:6px 0}
.md li+li{margin-top:4px}
.md h2,.md h3,.md h4{color:var(--text);font-size:16px;margin-top:16px}
.md blockquote{margin:8px 0;padding:8px 14px;border-left:3px solid var(--cy);background:var(--cy-soft);border-radius:0 10px 10px 0}
.md code,.it-detail code,.it-line code{font-family:var(--m);font-size:.88em;background:var(--card2);padding:1px 6px;border-radius:6px;color:var(--cy)}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.tw table{border-collapse:collapse;width:100%;font-size:14px;min-width:540px}
.tw th,.tw td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tw th{font-size:13px;font-weight:600;color:var(--dim);background:var(--card2);white-space:nowrap}
.tw tr:last-child td{border-bottom:0}
.tw td{color:var(--body)}
.tw tr.tap{cursor:pointer}
.tw tr.tap:hover td,.tw tr.tap:focus-visible td{background:var(--cy-soft)}
.tap-hint{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);margin-top:8px}
.tap-hint .ic{width:16px;height:16px}

/* checklists */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 14px}
.ph h1{font-size:clamp(26px,5vw,38px);font-weight:700}
.prog{font-family:var(--m);font-weight:700;color:var(--cy)}
.pbar{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;margin-bottom:18px}
.pbar i{display:block;height:100%;background:var(--cy);border-radius:6px;transition:width .25s}
.grp{margin-bottom:14px}
.grp header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.grp h2{font-size:18px;font-weight:600}
.checks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.ck{display:flex;gap:12px;align-items:flex-start;padding:9px 6px;border-radius:10px;cursor:pointer;line-height:1.5}
.ck:hover{background:var(--card2)}
.ck{position:relative}
.ck input{position:absolute;left:6px;top:10px;width:22px;height:22px;margin:0;opacity:0;cursor:pointer}
.cb{flex:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--dim);border-radius:6px;display:grid;place-items:center;background:transparent;box-sizing:border-box;transition:background .15s,border-color .15s}
.cb svg{width:14px;height:14px;opacity:0;stroke:var(--on-acc);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.ck input:checked + .cb{background:var(--cy);border-color:var(--cy)}
.ck input:checked + .cb svg{opacity:1}
.ck input:focus-visible + .cb{outline:2px solid var(--cy);outline-offset:2px}
.ck.done span{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--dim)}
.todo{display:grid;grid-template-columns:1fr;gap:2px;padding:4px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.due{margin-left:40px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);font-family:var(--m)}
.todo.over .due{color:var(--or);font-weight:700}
.ref-sec{margin-bottom:14px}
.ref-sec header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.ref-sec h2{font-size:18px;font-weight:600}

/* edit */
.editbar{display:flex;align-items:center;gap:10px;background:var(--cy-soft);border:1px solid var(--cy);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.editbar .ic{color:var(--cy)}
.syncbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--cy-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.syncbar>span{flex:1 1 200px}
.syncbar .ic{color:var(--cy)}
.syncbar.dirty{background:var(--or-soft);border-color:var(--or)}
.syncbar.dirty .ic{color:var(--or)}
.syncbar .btn .ic{color:inherit}
.syncbar .sb-x{background:transparent;border-color:transparent;margin:-6px -8px -6px 0;color:var(--dim)}
.syncbar .sb-x .ic{color:inherit}
.syncbar .sb-x:hover{border-color:var(--line);color:var(--text)}
.ed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.ed.drag-over{border-color:var(--cy);box-shadow:0 0 0 2px var(--cy-soft)}
.ed-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ed-bar b{flex:1;font-size:14px;font-weight:600;color:var(--body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grip{cursor:grab;color:var(--dim);display:none;padding:4px}
@media (hover:hover) and (pointer:fine){.grip{display:grid}}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed-grid .w2,.ed-grid .wf{grid-column:1/-1}
@media (min-width:760px){.ed-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.ed-grid .w2{grid-column:span 2}}
.ed-grid label,.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--dim);font-weight:500;min-width:0}
.ed-grid label.chk,.fld.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--text);padding-top:18px}
input,select,textarea{width:100%;background:var(--s1);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:400 16px/1.45 var(--f)}
input[type="checkbox"]{width:20px;height:20px;accent-color:var(--cy)}
textarea{resize:vertical;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px var(--cy-soft)}
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:6px}
.ed-row.todo-e{grid-template-columns:150px minmax(0,1fr) auto}
@media (max-width:560px){.ed-row.todo-e{grid-template-columns:1fr auto}.ed-row.todo-e>input:first-child{grid-column:1/-1}}
.rt{display:flex;gap:4px}
.stack{display:grid;gap:12px}

/* modal + fullscreen + toast */
.modal-back{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--s2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:22px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal-back{align-items:center;padding:20px}.modal{border-radius:20px;padding:24px}}
.modal h2{font-size:21px;font-weight:700;margin-bottom:8px}
.modal p{color:var(--body)}
.mbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:18px}
.mbtns.col{flex-direction:column;align-items:stretch}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.set b{font-weight:600}
.set .muted{margin-top:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;color:var(--body);padding:8px 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--s1)}
.sw{flex:none;width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--card2);position:relative;cursor:pointer;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--cy);border-color:var(--cy)}
.sw[aria-checked="true"] span{transform:translateX(22px);background:var(--on-acc)}
.note{font-size:13.5px;color:var(--dim);margin-top:14px}
.file{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:14px;padding:20px;margin:14px 0 10px;cursor:pointer;color:var(--text);font-weight:600}
.file:hover{border-color:var(--cy)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file:focus-within{border-color:var(--cy)}
.paste>summary{cursor:pointer;color:var(--body);font-size:14.5px;padding:6px 0}
.paste textarea{margin:8px 0;font-family:var(--m);font-size:13.5px}
.impsum{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14.5px}
.impsum h3{font-size:17px;margin-bottom:4px}
.impsum ul{margin:8px 0 0;padding-left:20px;color:var(--body)}
.impsum .warns{margin-top:12px;color:var(--or)}
.impsum .warns li{color:var(--or)}
.impsum .ok{margin-top:10px;color:var(--cy);font-weight:600}
.err{color:var(--or);margin-top:12px;font-weight:600}
.copybox{width:100%;height:260px;font-family:var(--m);font-size:13px;margin-top:10px}
.fs{position:fixed;inset:0;z-index:60;background:var(--s1);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 64px) 22px calc(env(safe-area-inset-bottom,0px) + 32px);cursor:pointer}
.fs-x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px}
.fs-in{max-width:900px;margin:0 auto;display:grid;gap:22px}
.fs-cell small{display:block;font-size:14px;color:var(--dim);margin-bottom:2px}
.fs-cell div{font-size:24px;line-height:1.4;color:var(--text);font-weight:500}
.fs-cell.cjk div{font-family:var(--zh);font-size:clamp(40px,10vw,76px);font-weight:700;line-height:1.25}
.fs-sec{font-size:clamp(24px,5.5vw,40px);line-height:1.5;color:var(--text)}
.fs-sec .md,.fs-sec .md p{font-size:inherit;color:var(--text);font-family:var(--zh)}
.fs-hint{text-align:center;color:var(--dim);font-size:14px;margin-top:36px}
.toasts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:70;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--s1);border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:500;max-width:520px}
.toast .btn{background:transparent;color:var(--s1);border-color:var(--s1)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- transit line chips + blocks (line colours are data, not UI accents) ---------- */
.lchip{display:inline-flex;align-items:center;gap:6px;background:var(--lc);color:var(--li);border-radius:7px;padding:1px 9px 1px 7px;font-size:12.5px;font-weight:600;line-height:1.65;white-space:nowrap;max-width:100%}
.lchip b{font-family:var(--m);font-weight:700}
.lchip i{font-style:normal;font-weight:500;opacity:.9}
.lchip.sm{padding:0 7px;font-size:12px;line-height:1.6}
.lblk{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 18px;background:var(--tint,var(--card2));overflow:hidden}
.lblk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--stripe,var(--dim))}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchips+.lbody{margin-top:8px}
.lbody{color:var(--text);font-size:15px;line-height:1.55}
.llegend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.ibtn.lang{font-family:var(--m);font-weight:700;font-size:13px;letter-spacing:.02em}
.en-fields>summary{cursor:pointer;color:var(--body);font-size:14px;font-weight:500;padding:4px 0}
.en-fields[open]>summary{margin-bottom:8px}
@media (max-width:480px){.tb-in{gap:6px;padding:0 12px}.edbtn span{display:none}.edbtn{padding:0 11px;min-width:40px}}

.note.ver{cursor:default;-webkit-user-select:none;user-select:none;padding:6px 0}

/* ---------- now + next card (Phase 4) ---------- */
.nowcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--or);border-radius:12px;padding:12px 14px;margin:4px 0 16px;display:grid;gap:8px}
.nc-now{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;color:var(--body)}
.nc-now .ic{width:17px;height:17px;color:var(--or)}
.nc-now b{font-family:var(--m);color:var(--text)}
.nc-main{display:grid;gap:4px;text-align:left;width:100%;background:transparent;border:0;padding:0;color:var(--text);cursor:pointer}
.nc-k{font-size:13px;color:var(--dim)}
.nc-k b{color:var(--or);font-weight:700}
.nc-t{font-weight:700;font-size:19px;line-height:1.35}
.nc-time{font-family:var(--m);color:var(--or);margin-right:8px}
.nc-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--body)}
.nc-cost{font-size:13.5px;color:var(--dim)}
.nc-done{font-size:14px;color:var(--body)}
.nc-map{justify-self:start}
.nc-map .ic{width:16px;height:16px}

</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main id="app"></main>

<script>window.TP_TARGET="pages";window.TP_API="https://script.google.com/macros/s/AKfycbz9-N4PNWOdRzyS63eLFxOxaTYFBoBZuoFvGNjoUGi2OKKhTZqXRQLlHbEHGPn9Zl_Y/exec";window.TP_SEED=[];window.TP_TEMPLATE="\u003c!--\nTRAVEL PLAN TEMPLATE · v2\nใช้กับเว็บแผนเที่ยว (Travel Plan) — import ไฟล์นี้ได้โดยตรง\n\n══ วิธีใช้กับ Claude ══\nแนบไฟล์นี้ + ข้อมูลดิบของทริป (โน้ต, ตั๋ว, ใบจอง, PDF) แล้วสั่งว่า\n\"สร้างแผนตาม travel-plan-template.md ทำตามกฎในกล่องคอมเมนต์ด้านบนทุกข้อ\nห้ามเปลี่ยนชื่อหัวข้อและชื่อ field อะไรที่ไม่รู้ให้ใส่ ❓ ห้ามเดา\nส่งผลเป็นไฟล์ .md ไฟล์เดียว\"\nหลังได้ไฟล์: เว็บ → นำเข้า .md → ดู \"คำเตือน\" ในหน้าตรวจก่อนนำเข้า\nถ้ามีคำเตือน ส่งข้อความคำเตือนกลับให้ Claude แก้แล้วนำเข้าใหม่\n\n══ กฎสำหรับ Claude (คนสร้างแผน) ══\nA. ห้ามเดา: ข้อมูลที่ไม่มีในข้อมูลดิบให้ใส่ ❓ หรือเว้นว่าง ห้ามแต่งเวลา ราคา ที่อยู่ สีสายรถไฟ\nB. สถานะ (field status และคอลัมน์ สถานะ) ใช้ตามความหมายนี้เท่านั้น:\n     ✅ ยืนยันแล้ว   ผู้ใช้บอกเองว่าจอง/จ่าย/ยืนยันแล้ว (เช่น \"จองแล้ว\") — Claude ห้ามติด ✅ ให้สิ่งที่ตัวเองสรุป\n     📄 ตามเอกสาร   มาจากข้อมูลดิบ/ตั๋ว/PDF ที่ผู้ใช้ให้ ยังไม่มีใครตรวจซ้ำ\n     🔎 ตรวจเว็บแล้ว ตรวจกับเว็บไซต์แล้ว (ระบุแหล่งไว้ใน # วางแผน)\n     ⚠️ ต้องยืนยัน   ข้อมูลขัดกัน / เสี่ยงผิด / ผู้ใช้เขียนว่า \"ไม่แน่ใจ\" \"?\"\n     ❓ ยังไม่ทราบ   ไม่มีข้อมูล\n   ของที่ \"ยังไม่จอง / จองแล้วแต่ยังไม่จ่าย\" ใช้ ⚠️ แล้วเพิ่มงานนั้นใน # To-do\nC. Claude ร่างส่วนที่ผู้ใช้ไม่ได้ให้มาตรงๆ ได้ แต่ทุกบรรทัดที่สรุปเองต้องขึ้นต้นด้วย ❓\n   ได้แก่ ## ห้ามพลาดวันนี้ · ## ข้อควรระวัง · # วางแผน (จุดขัดแย้ง สิ่งที่ยังไม่ยืนยัน แหล่งข้อมูล)\n   ส่วนช่องภาษาอังกฤษ (_en) ให้แปลจากข้อความไทยตรงๆ ได้เลยโดยไม่ต้องติด ❓\nD. หนึ่ง field = หนึ่งภาษา: ข้อความไทยใส่ field หลัก ภาษาอังกฤษใส่ field _en\n   ห้ามเขียนสองภาษาในช่องเดียว เช่น \"~30 นาที/min\" ❌ → cost: ~30 นาที + cost_en: ~30 min ✅\nE. เวลา: เว็บใช้ตัวเลข HH:MM ตัวแรกของเวลาวาง \"เส้นตอนนี้\" และการ์ด \"ถัดไป\"\n   ถ้ารู้เวลาโดยประมาณให้เขียน ~14:00 · ถ้าไม่รู้เลยเขียน ❓ หรือคำอย่าง \"บ่าย\" ได้\n   (รายการนั้นจะไม่ขึ้นในการ์ด \"ถัดไป     return new Promise(function (res) {
      var back = D.createElement('div'); back.className = 'modal-back';
      back.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
      D.body.appendChild(back); D.body.classList.add('lock');
      var m = back.firstChild, prev = D.activeElement;
      function close(v) { back.remove(); if (!$('.modal-back') && !$('.fs')) D.body.classList.remove('lock'); D.removeEventListener('keydown', onKey); if (prev && prev.focus) try { prev.focus(); } catch (e) { } res(v); }
      function onKey(e) { if (e.key === 'Escape') close(null); }
      D.addEventListener('keydown', onKey);
      back.addEventListener('click', function (e) { if (e.target === back && !o.sticky) return close(null); var b = e.target.closest('[data-res]'); if (b) close(b.getAttribute('data-res')); });
      if (o.onOpen) o.onOpen(m, close);
      var f = $('[autofocus]', m) || $('button, input, a', m); if (f) f.focus();
    });
  }
  function toast(msg, o) {
    o = o || {};
    var el = D.createElement('div'); el.className = 'toast';
    el.innerHTML = '<span>' + esc(msg) + '</span>' + (o.undo ? T('<button class="btn sm">เลิกทำ</button>') : '');
    $('#toasts').appendChild(el);
    var tm = setTimeout(function () { el.remove(); }, o.undo ? 7000 : 2600);
    if (o.undo) $('button', el).onclick = function () { clearTimeout(tm); el.remove(); o.undo(); };
  }
  function openFs(html) {
    var el = D.createElement('div'); el.className = 'fs'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = T('<button class="ibtn fs-x" aria-label="ปิด">') + icon('x') + '</button><div class="fs-in">' + html + T('</div><p class="fs-hint">แตะที่ใดก็ได้เพื่อปิด</p>');
    D.body.appendChild(el); D.body.classList.add('lock');
    function close() { el.remove(); if (!$('.modal-back')) D.body.classList.remove('lock'); D.removeEventListener('keydown', k); }
    function k(e) { if (e.key === 'Escape') close(); }
    D.addEventListener('keydown', k); el.addEventListener('click', close); $('.fs-x', el).focus();
  }

  /* ---------------- files ---------------- */
  var dlPromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(function () { return null; }) : Promise.resolve(null);
  function blobDownload(name, text) { var a = D.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' })); a.download = name; D.body.appendChild(a); a.click(); a.remove(); }
  function saveFile(name, text) {
    if (IN_GAS) { showCopy(name, text, true); return Promise.resolve(); }   // the Apps Script iframe may block downloads silently, so always offer copy too
    return dlPromise.then(function (dl) {
      if (dl) return dl.save({ filename: name, data: text }).then(function () { toast(T('บันทึกไฟล์แล้ว')); }, function (e) { if (e && e.code === 'declined') return; showCopy(name, text); });
      if (!window.claude) {
        try { blobDownload(name, text); return; } catch (e) { }
      }
      showCopy(name, text);
    });
  }
  function showCopy(name, text, withDl) {
    var head = withDl ? T('</h2><p>กดดาวน์โหลด ถ้าไม่มีไฟล์ออกมา ให้คัดลอกข้อความด้านล่างไปบันทึกเป็นไฟล์แทน</p><textarea class="copybox" readonly>') : T('</h2><p>ดาวน์โหลดจากหน้านี้ไม่ได้ คัดลอกข้อความด้านล่างไปบันทึกเป็นไฟล์แทน</p><textarea class="copybox" readonly>');
    modal('<h2>' + esc(name) + head + esc(text) + T('</textarea><div class="mbtns"><button class="btn" data-res="x">ปิด</button>') + (withDl ? '<button class="btn" data-dl>' + icon('download') + '<span>' + T('ดาวน์โหลด') + '</span></button>' : '') + T('<button class="btn pri" data-copy>คัดลอก</button></div>'), {
      onOpen: function (m) {
        var ta = $('textarea', m), dlb = $('[data-dl]', m);
        if (dlb) dlb.onclick = function () { try { blobDownload(name, text); } catch (e) { toast(T('ดาวน์โหลดไม่ได้ ใช้ปุ่มคัดลอกแทน')); } };
        $('[data-copy]', m).onclick = function () {
          ta.focus(); ta.select();
          var ok = false; try { ok = D.execCommand('copy'); } catch (e) { }
          if (navigator.clipboard && !ok) navigator.clipboard.writeText(text).then(function () { toast(T('คัดลอกแล้ว')); }, function () { toast(T('เลือกข้อความแล้ว กดคัดลอกเอง')); });
          else toast(ok ? T('คัดลอกแล้ว') : T('เลือกข้อความแล้ว กดคัดลอกเอง'));
        };
      }
    });
  }
  function fileSlug(t) { return (t.id || 'trip').replace(/[^a-z0-9-]+/g, '-'); }
  function exportBundle(trips) { return JSON.stringify({ app: 'travel-plan', schema: 1, exportedAt: new Date().toISOString(), trips: trips }, null, 2); }

  /* ---------------- import ---------------- */
  function impSummary(r) {
    var t = r.trip, items = t.days.reduce(function (a, d) { return a + d.items.length; }, 0);
    var pi = countPack(t)[1];
    return '<div class="impsum"><h3>' + esc(t.meta.title || T('(ไม่มีชื่อ)')) + '</h3><p class="muted">' + esc(fmtRange(t.meta.start, t.meta.end)) + (t.meta.timezone ? ' · ' + esc(t.meta.timezone) : '') + '</p><ul>' +
      t.days.map(function (d, i) { return '<li>Day ' + (i + 1) + ' · ' + esc(fmtDate(d.date, false, false)) + ' · ' + cnt(d.items.length, 'item') + '</li>'; }).join('') +
      T('<li>รวม ') + items + T(' รายการ · เตรียมของ ') + pi + T(' ชิ้น · To-do ') + t.todo.length + T(' · ข้อมูลอ้างอิง ') + t.ref.length + T(' หัวข้อ</li></ul>') +
      (r.warnings.length ? T('<div class="warns"><b>ต้องตรวจ ') + r.warnings.length + T(' จุด</b><ul>') + r.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>' : T('<p class="ok">อ่านได้ครบ ไม่พบปัญหา</p>')) + '</div>';
  }
  function openImport() {
    var parsed = null, jsonTrips = null;
    return modal(T('<h2>นำเข้าแผน</h2><p>ไฟล์ .md ตาม template หรือไฟล์สำรอง .json จากเว็บนี้</p>') +
      '<label class="file">' + icon('upload') + T('<span>เลือกไฟล์</span><input type="file" accept=".md,.markdown,.txt,.json,text/markdown,text/plain,application/json" data-imp="file"></label>') +
      T('<details class="paste"><summary>วางหรือแก้ข้อความ markdown ก่อนบันทึก</summary><textarea data-imp="text" rows="9" placeholder="วางเนื้อหาไฟล์ .md ที่นี่"></textarea><button class="btn" data-imp="check">ตรวจข้อความ</button></details>') +
      T('<div data-imp="out" aria-live="polite"></div><div class="mbtns"><button class="btn" data-res="cancel">ยกเลิก</button><button class="btn pri" data-imp="save" disabled>บันทึกแผน</button></div>'), {
      sticky: true,
      onOpen: function (m, close) {
        var out = $('[data-imp="out"]', m), save = $('[data-imp="save"]', m), ta = $('[data-imp="text"]', m);
        function handle(text, name) {
          parsed = null; jsonTrips = null;
          if (/\.json$/i.test(name || '') || /^\s*\{/.test(text)) {
            try {
              var j = JSON.parse(text), arr = Array.isArray(j.trips) ? j.trips : (j.meta ? [j] : null);
              if (!arr) throw new Error('x');
              jsonTrips = arr.filter(function (x) { return x && x.meta && Array.isArray(x.days); });
              out.innerHTML = T('<div class="impsum"><h3>ไฟล์สำรอง ') + jsonTrips.length + T(' แผน</h3><ul>') + jsonTrips.map(function (x) { return '<li>' + esc(x.meta.title) + ' · ' + esc(fmtRange(x.meta.start, x.meta.end)) + '</li>'; }).join('') + '</ul></div>';
              save.disabled = !jsonTrips.length;
            } catch (e) { out.innerHTML = T('<p class="err">อ่านไฟล์ JSON ไม่ได้ ตรวจว่าเป็นไฟล์สำรองจากเว็บนี้</p>'); save.disabled = true; }
            return;
          }
          var r = TP.parse(text); parsed = r; out.innerHTML = impSummary(r);
          var ok = r.trip.meta.title && TP.isDate(r.trip.meta.start) && TP.isDate(r.trip.meta.end) && r.trip.days.length;
          if (!ok) out.innerHTML += T('<p class="err">บันทึกไม่ได้: ต้องมี title, start, end และอย่างน้อย 1 Day</p>');
          save.disabled = !ok;
        }
        $('[data-imp="file"]', m).addEventListener('change', function (e) {
          var f = e.target.files && e.target.files[0]; if (!f) return;
          var rd = new FileReader();
          rd.onload = function () { var tx = String(rd.result); if (!/\.json$/i.test(f.name)) { ta.value = tx; } handle(tx, f.name); };
          rd.onerror = function () { out.innerHTML = T('<p class="err">อ่านไฟล์ไม่ได้</p>'); };
          rd.readAsText(f);
        });
        $('[data-imp="check"]', m).addEventListener('click', function () { handle(ta.value, ''); });
        save.addEventListener('click', function () { if (parsed && ta.value.trim()) { var r = TP.parse(ta.value); if (r.trip.days.length) parsed = r; } close('save'); });
      }
    }).then(function (res) {
      if (res !== 'save') return;
      if (jsonTrips) return jsonTrips.reduce(function (p, x) { return p.then(function () { return addTrip(normalizeTrip(x)); }); }, Promise.resolve());
      if (parsed) return addTrip(parsed.trip);
    });
  }
  function addTrip(trip) {
    var dup = S.trips.filter(function (t) { return sameTrip(t, trip); })[0];
    var step = dup ? modal(T('<h2>มีแผนนี้อยู่แล้ว</h2><p>“') + esc(trip.meta.title) + '” ' + esc(fmtRange(trip.meta.start, trip.meta.end)) + T(' มีอยู่ในเครื่องนี้แล้ว</p><div class="mbtns col"><button class="btn pri" data-res="over">เขียนทับแผนเดิม</button><button class="btn" data-res="both">เก็บเป็นอีกแผน</button><button class="btn" data-res="cancel">ยกเลิก</button></div>')) : Promise.resolve('new');
    return step.then(function (c) {
      if (c === 'over') { replaceTrip(dup, trip, true); saveNow(); toast(T('เขียนทับแผนแล้ว')); go(trip.id); return; }
      if (c !== 'both' && c !== 'new') return;
      trip.id = makeId(trip.meta); trip.origin = 'import'; trip.localEdited = true; trip.updatedAt = Date.now();
      S.trips.push(trip); saveNow(); toast(T('นำเข้าแผนแล้ว')); go(trip.id);
    });
  }

  /* ---------------- settings ---------------- */
  function langSeg() { return '<div class="seg"><button data-set="lang" data-v="th" aria-pressed="' + (LANG === 'th') + '">ไทย</button><button data-set="lang" data-v="en" aria-pressed="' + (LANG === 'en') + '">English</button></div>'; } /*noT*/
  function settingsHtml() {
    var dark = S.settings.theme !== 'light', p = S.settings.planning, own = S.settings.owner;
    return T('<h2>ตั้งค่า</h2>') +
      T('<div class="set"><div><b>ธีม</b><p class="muted">เริ่มต้นเป็นธีมมืด</p></div><div class="seg"><button data-set="theme" data-v="dark" aria-pressed="') + dark + T('">มืด</button><button data-set="theme" data-v="light" aria-pressed="') + !dark + T('">สว่าง</button></div></div>') +
      T('<div class="set"><div><b>ภาษา / Language</b></div>') + langSeg() + '</div>' +
      (own && !HAS_SERVER ? T('<div class="set"><div><b>โหมดเจ้าของ</b><p class="muted">เปิดโหมดวางแผน การแก้ไข นำเข้า ส่งออก การแก้ไขอยู่ในเครื่องนี้เท่านั้น คนอื่นไม่เห็น</p></div><button class="btn sm" data-set="owner-off">ออกจากโหมดเจ้าของ</button></div>') : '') +
      (own && HAS_SERVER ? T('<div class="set"><div><b>โหมดเจ้าของ</b><p class="muted">เปิดโหมดวางแผนและการแก้ไข แก้แล้วกด “บันทึกขึ้น Drive” คนอื่นจึงจะเห็น</p></div><button class="btn sm" data-set="owner-off">ออกจากโหมดเจ้าของ</button></div>') : '') +
      (own && HAS_SERVER ? (editKey()
        ? T('<div class="set"><div><b>รหัสแก้ไข</b><p class="muted">ยืนยันแล้ว จำไว้ในเครื่องนี้</p></div><button class="btn sm" data-set="key-forget">ลืมรหัสในเครื่องนี้</button></div>')
        : T('<div class="set"><div><b>รหัสแก้ไข</b><p class="muted">ต้องใส่ก่อนบันทึกขึ้น Drive</p></div><button class="btn sm pri" data-set="key">ใส่รหัส</button></div>')) : '') +
      (own ? T('<div class="set"><div><b>โหมดวางแผน</b><p class="muted">แสดงสถานะข้อมูล หน้าวางแผน และเครื่องมือแก้ไข นำเข้า ส่งออก</p></div><button class="sw" role="switch" aria-checked="') + p + T('" aria-label="โหมดวางแผน" data-set="planning"><span></span></button></div>') : '') +
      (p && SEEDS.length ? T('<div class="set"><div><b>ใช้แผนที่มากับลิงก์</b><p class="muted">ล้างการแก้ไขในเครื่องนี้ของแผนที่มากับลิงก์ แล้วโหลดใหม่ (การติ๊กยังอยู่)</p></div><button class="btn danger sm" data-set="reset">รีเซ็ต</button></div>') : '') +
      '<p class="note">' + (!storageOK ? T('เบราว์เซอร์นี้ไม่ให้บันทึกข้อมูล การแก้ไขจะหายเมื่อปิดหน้า')
        : HAS_SERVER ? (own ? T('แผนหลักอยู่บน Drive ของเจ้าของ การแก้ไขที่ยังไม่บันทึกและการติ๊กเก็บในเครื่องนี้') : T('แผนโหลดจาก Drive ของเจ้าของ การติ๊กเก็บในเครื่องนี้เท่านั้น'))
        : own ? T('แผน การแก้ไข และการติ๊ก เก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น') : T('การติ๊กเก็บในเครื่องนี้เท่านั้น')) + '</p>' +
      '<p class="note ver" data-ver>' + T('แผนเที่ยว') + ' ' + APP_VERSION + '</p>' +
      T('<div class="mbtns"><button class="btn pri" data-res="ok">เสร็จ</button></div>');
  }
  function openSettings() {
    modal(settingsHtml(), {
      onOpen: function (m, close) {
        var verTaps = 0, verT = 0;
        m.addEventListener('click', function (e) {
          if (e.target.closest('[data-ver]')) {   // 7 quick taps on the version line unlock owner mode (a UI guard, not security)
            var now = Date.now(); verTaps = now - verT < 1500 ? verTaps + 1 : 1; verT = now;
            if (verTaps >= 7 && !S.settings.owner) { S.settings.owner = true; lsSet(K.set, S.settings); render(true); m.innerHTML = settingsHtml(); toast(T('เปิดโหมดเจ้าของแล้ว')); }
            return;
          }
          var b = e.target.closest('[data-set]'); if (!b) return;
          var k = b.getAttribute('data-set');
          if (k === 'theme') S.settings.theme = b.getAttribute('data-v');
          else if (k === 'lang') S.settings.lang = b.getAttribute('data-v');
          else if (k === 'planning') { S.settings.planning = !S.settings.planning; if (!S.settings.planning) S.edit = false; }
          else if (k === 'owner-off') { S.settings.owner = false; S.settings.planning = false; S.edit = false; lsSet(K.key, ''); toast(T('ออกจากโหมดเจ้าของแล้ว')); }
          else if (k === 'reset') { close('x'); resetSeed(); return; }
          else if (k === 'key') { close('x'); askKey(); return; }
          else if (k === 'key-forget') { lsSet(K.key, ''); toast(T('ลบรหัสออกจากเครื่องนี้แล้ว')); }
          lsSet(K.set, S.settings); render(true); m.innerHTML = settingsHtml();
          var again = $('[data-set="' + k + '"]', m); if (again) again.focus();
        });
      }
    });
  }
  function resetSeed() {
    modal(T('<h2>รีเซ็ตแผนจากลิงก์</h2><p>การแก้ไขในเครื่องนี้ของแผนที่มากับลิงก์จะหายไป ส่งออก .md หรือ .json เก็บไว้ก่อนถ้ายังต้องใช้</p><div class="mbtns"><button class="btn" data-res="no">ยกเลิก</button><button class="btn danger" data-res="yes">รีเซ็ต</button></div>')).then(function (c) {
      if (c !== 'yes') return;
      seedTrips().forEach(function (t) {
        var ex = S.trips.filter(function (x) { return sameTrip(x, t); })[0];
        if (ex) replaceTrip(ex, t, false); else { t.id = makeId(t.meta); t.origin = 'seed'; t.localEdited = false; t.updatedAt = Date.now(); S.trips.push(t); }
      });
      saveNow(); render(true); toast(T('รีเซ็ตแล้ว'));
    });
  }

  /* ---------------- events ---------------- */
  D.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-act'), t = S.cur;
    switch (a) {
      case 'toggle': {
        var id = b.getAttribute('data-id'), li = b.closest('.it');
        S.open[id] = !S.open[id]; li.classList.toggle('open', !!S.open[id]); b.setAttribute('aria-expanded', !!S.open[id]);
        syncExpandBtn(); return;
      }
      case 'expand-all': {
        var v = b.getAttribute('data-v') === '1';
        $$('.tl .it').forEach(function (li) { var id = li.getAttribute('data-id'); if (!$('.it-detail', li)) return; S.open[id] = v; li.classList.toggle('open', v); var bt = $('.it-main', li); if (bt) bt.setAttribute('aria-expanded', v); });
        syncExpandBtn(); return;
      }
      case 'lang': S.settings.lang = LANG === 'en' ? 'th' : 'en'; lsSet(K.set, S.settings); render(true); return;
      case 'theme': S.settings.theme = S.settings.theme === 'light' ? 'dark' : 'light'; lsSet(K.set, S.settings); render(true); return;
      case 'settings': openSettings(); return;
      case 'edit-toggle': S.edit = !S.edit; if (!S.edit) saveNow(); render(false); window.scrollTo(0, 0); return;
      case 'import': openImport(); return;
      case 'save-remote': saveRemote(false); return;
      case 'sync-hide': syncHide(true); refreshSyncBar(); return;
      case 'goto-item': { var gid = b.getAttribute('data-id'); S.open[gid] = true; S.scrollItem = gid; var gh = t.id + '--d' + (+b.getAttribute('data-d') + 1); if (location.hash === '#' + gh) { render(true); scrollToItem(); } else location.hash = gh; return; }
      case 'promote': promoteTrip(t); return;
      case 'reload-remote': S.remote.state = 'loading'; render(true); loadRemote(); return;
      case 'discard-local':
        modal(T('<h2>ทิ้งการแก้ไขในเครื่องนี้?</h2><p>การแก้ไขที่ยังไม่บันทึกขึ้น Drive จะหายไป แล้วโหลดแผนจาก Drive มาแทน</p><div class="mbtns"><button class="btn" data-res="no">ยกเลิก</button><button class="btn danger" data-res="yes">ทิ้งการแก้ไข</button></div>')).then(function (c) { if (c === 'yes') discardLocal(); });
        return;
      case 'template': saveFile('travel-plan-template.md', window.TP_TEMPLATE || ''); return;
      case 'export-all': saveFile('travel-plans-backup.json', exportBundle(S.trips)); return;
      case 'export-md': if (t) saveFile(fileSlug(t) + '.md', TP.toMarkdown(t)); return;
      case 'export-json': if (t) saveFile(fileSlug(t) + '.json', exportBundle([t])); return;
      case 'delete-trip':
        if (!t) return;
        modal(T('<h2>ลบแผนนี้?</h2><p>“') + esc(t.meta.title) + T('” จะถูกลบจากเครื่องนี้ ส่งออก .md เก็บไว้ก่อนถ้ายังต้องใช้</p><div class="mbtns"><button class="btn" data-res="no">ยกเลิก</button><button class="btn danger" data-res="yes">ลบแผน</button></div>')).then(function (c) {
          if (c !== 'yes') return;
          var snap = JSON.stringify(t), idx = S.trips.indexOf(t);
          S.trips.splice(idx, 1); saveNow(); go('home');
          toast(T('ลบแผนแล้ว'), { undo: function () { S.trips.splice(idx, 0, JSON.parse(snap)); saveNow(); render(true); } });
        });
        return;
      case 'cal': {
        var d = +b.getAttribute('data-d');
        if (!d) S.cal = nowIn().date.slice(0, 7);
        else { var p = S.cal.split('-').map(Number), mo = p[1] - 1 + d, y = p[0] + Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12; S.cal = y + '-' + String(mo + 1).padStart(2, '0'); }
        render(true); return;
      }
      case 'fs-row': {
        var sec = t.ref[+b.getAttribute('data-sec')]; if (!sec || !window.marked) return;
        var tabs = window.marked.lexer(prepMd(sec.md)).filter(function (x) { return x.type === 'table'; });
        var tk = tabs[+b.getAttribute('data-t')]; if (!tk) return;
        var row = tk.rows[+b.getAttribute('data-r')];
        openFs(row.map(function (c, i) { var cjk = hasCJK(c.text); return '<div class="fs-cell' + (cjk ? ' cjk' : '') + '"' + (cjk ? ' lang="zh-Hant"' : '') + '><small>' + window.marked.parseInline(tk.header[i] ? tk.header[i].text : '') + '</small><div>' + (window.marked.parseInline(c.text) || '—') + '</div></div>'; }).join(''));
        return;
      }
      case 'fs-sec': { var s2 = t.ref[+b.getAttribute('data-sec')]; if (s2) openFs((s2.title ? '<p class="muted">' + inl(s2.title) + '</p>' : '') + '<div class="fs-sec"><div class="md">' + mdHtml(s2.md) + '</div></div>'); return; }
      case 'add': {
        var list = getPath(t, b.getAttribute('data-list')); list.push(NEW[b.getAttribute('data-new')](t));
        edited(); S.focus = b.getAttribute('data-list') + '.' + (list.length - 1); render(true); return;
      }
      case 'del': {
        var snap2 = JSON.stringify(t), l2 = getPath(t, b.getAttribute('data-list'));
        l2.splice(+b.getAttribute('data-i'), 1); edited(); render(true);
        toast(T('ลบแล้ว'), { undo: function () { restoreTrip(snap2); } });
        return;
      }
      case 'mv': {
        var l3 = getPath(t, b.getAttribute('data-list')), i = +b.getAttribute('data-i'), j = i + (+b.getAttribute('data-d'));
        if (j < 0 || j >= l3.length) return;
        var tmp = l3[i]; l3[i] = l3[j]; l3[j] = tmp; edited(); render(true);
        var nb = $('[data-act="mv"][data-list="' + b.getAttribute('data-list') + '"][data-i="' + j + '"][data-d="' + b.getAttribute('data-d') + '"]'); if (nb && !nb.disabled) nb.focus();
        return;
      }
    }
  });
  function syncExpandBtn() {
    var b = $('[data-act="expand-all"]'); if (!b) return;
    var lis = $$('.tl .it').filter(function (li) { return $('.it-detail', li); });
    var all = lis.length && lis.every(function (li) { return li.classList.contains('open'); });
    b.setAttribute('data-v', all ? '0' : '1'); b.textContent = all ? T('ย่อทั้งหมด') : T('ขยายทั้งหมด');
  }
  function restoreTrip(snap) { var t = JSON.parse(snap), idx = -1; S.trips.forEach(function (x, i) { if (x.id === t.id) idx = i; }); if (idx >= 0) S.trips[idx] = t; else S.trips.push(t); saveNow(); render(true); }
  D.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); }
  });
  function onBind(e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute('data-chk')) { if (e.type === 'change') toggleCheck(el); return; }
    var p = el.getAttribute && el.getAttribute('data-b'); if (!p || !S.cur) return;
    var k = el.getAttribute('data-k'), v;
    if (k === 'bool') v = el.checked;
    else if (k === 'lines') v = el.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    else v = el.value;
    setPath(S.cur, p, v); edited();
  }
  D.addEventListener('input', onBind);
  D.addEventListener('change', onBind);
  function toggleCheck(el) {
    var t = S.cur; if (!t) return;
    setPath(t, el.getAttribute('data-chk') + '.done', el.checked);
    saveSoon();
    var lab = el.closest('.ck'); if (lab) lab.classList.toggle('done', el.checked);
    if (S.tab === 'pack') {
      var c = countPack(t), pe = $('[data-prog="pack"]'), pb = $('[data-pbar="pack"]');
      if (pe) pe.textContent = c[0] + '/' + c[1]; if (pb) pb.style.width = (c[1] ? Math.round(c[0] * 100 / c[1]) : 0) + '%';
      t.pack.forEach(function (g, gi) { var ge = $('[data-prog-g="' + gi + '"]'); if (ge) ge.textContent = g.items.filter(function (x) { return x.done; }).length + '/' + g.items.length; });
    } else if (S.tab === 'todo') {
      var d = t.todo.filter(function (x) { return x.done; }).length, te = $('[data-prog="todo"]'), tb = $('[data-pbar="todo"]');
      if (te) te.textContent = d + '/' + t.todo.length; if (tb) tb.style.width = Math.round(d * 100 / t.todo.length) + '%';
      var li = el.closest('.todo'); if (li && el.checked) li.classList.remove('over');
    }
  }
  D.addEventListener('toggle', function (e) { if (e.target.classList && e.target.classList.contains('cal-det')) S.calOpen = e.target.open; }, true);

  /* drag to reorder (desktop) */
  var drag = null;
  D.addEventListener('mousedown', function (e) { var g = e.target.closest('[data-grip]'); if (!g) return; var box = g.closest('.ed'); if (box) box.setAttribute('draggable', 'true'); });
  D.addEventListener('dragstart', function (e) { var box = e.target.closest && e.target.closest('.ed[draggable="true"]'); if (!box) return; drag = { list: box.getAttribute('data-dl'), i: +box.getAttribute('data-i') }; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', 'x'); } catch (er) { } });
  D.addEventListener('dragover', function (e) { if (!drag) return; var box = e.target.closest && e.target.closest('.ed'); if (!box || box.getAttribute('data-dl') !== drag.list) return; e.preventDefault(); $$('.ed.drag-over').forEach(function (x) { if (x !== box) x.classList.remove('drag-over'); }); box.classList.add('drag-over'); });
  D.addEventListener('drop', function (e) {
    if (!drag) return; var box = e.target.closest && e.target.closest('.ed'); if (!box || box.getAttribute('data-dl') !== drag.list) return;
    e.preventDefault(); var j = +box.getAttribute('data-i'), l = getPath(S.cur, drag.list);
    if (j !== drag.i) { var it = l.splice(drag.i, 1)[0]; l.splice(j, 0, it); edited(); }
    drag = null; render(true);
  });
  D.addEventListener('dragend', function () { drag = null; $$('.ed[draggable]').forEach(function (x) { x.removeAttribute('draggable'); x.classList.remove('drag-over'); }); });

  window.addEventListener('hashchange', function () { render(false); if (!scrollToItem()) window.scrollTo(0, 0); });
  window.addEventListener('pagehide', saveNow);
  setInterval(function () { if (S.cur && !S.edit) { placeNow(); refreshNowCard(); } }, 60000);
  D.addEventListener('visibilitychange', function () { if (D.visibilityState === 'visible' && S.cur && !S.edit) { placeNow(); refreshNowCard(); } });
  /* GAS: coming back to the tab after 5+ minutes picks up the owner's latest save (no polling, to stay inside quota) */
  D.addEventListener('visibilitychange', function () { if (HAS_SERVER && D.visibilityState === 'visible' && !S.edit && !S.remote.busy && Date.now() - S.remote.at > 300000) loadRemote(); });
  /* GAS: the page runs in an iframe, so copy our hash to the address bar to keep links shareable.
     Not before getLocation() has answered, or we would wipe the deep link the visitor opened. */
  var hashReady = !IN_GAS, lastMirror = null;
  function gasApi(k) { return IN_GAS && window.google && window.google.script ? window.google.script[k] : null; }
  function mirrorHash() {
    var h = gasApi('history'), cur = location.hash.slice(1);
    if (!hashReady || !h || !h.replace || cur === lastMirror) return;
    lastMirror = cur; try { h.replace(null, null, cur); } catch (e) { }
  }

  /* ---------------- boot ---------------- */
  var conflicts = initData();
  if (!location.hash || location.hash === '#' || location.hash === '#home') {
    var on = sortedTrips().filter(function (x) { return x.s.status === 'ongoing' && x.s.dayIdx >= 0; })[0];
    var st0 = HAS_SERVER ? serverTrip() : null;
    if (st0) { S.remote.first = false; history.replaceState(null, '', '#' + landing(st0)); }
    else if (on) history.replaceState(null, '', '#' + on.t.id + '--d' + (on.s.dayIdx + 1));
  }
  render(false);
  if (HAS_SERVER) {
    var gu = gasApi('url');
    var onLoc = function (loc) {
      var h = loc && loc.hash; hashReady = true;
      if (h && h !== location.hash.slice(1)) { S.remote.first = false; location.hash = h; } else mirrorHash();
    };
    if (gu && gu.getLocation) { try { gu.getLocation(onLoc); } catch (e) { onLoc(null); } } else onLoc(null);
    loadRemote();
  }
  conflicts.reduce(function (p, c) {
    return p.then(function () {
      return modal(T('<h2>แผนนี้มีเวอร์ชันใหม่จากลิงก์</h2><p>“') + esc(c[1].meta.title) + '” ' + (c[1].meta.version ? '(' + esc(c[1].meta.version) + ') ' : '') + T('มากับลิงก์นี้ แต่ในเครื่องนี้มีการแก้ไขไว้</p><div class="mbtns col"><button class="btn pri" data-res="new">ใช้เวอร์ชันใหม่</button><button class="btn" data-res="keep">เก็บของในเครื่อง</button></div>'), { sticky: true }).then(function (r) {
        if (r === 'new') { replaceTrip(c[0], c[1], false); saveNow(); render(true); }
      });
    });
  }, Promise.resolve());
})();

</script>
